apiVersion: batch/v1
kind: Job
metadata:
  name: init-sonarqube-db
spec:
  template:
    spec:
      containers:
        - name: init-db
          image: ucloud-nexus.alauda.cn:60080/bitnami/postgresql:14.17.0-debian-12-r6
          env:
            - name: POSTGRES_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: jdbc-password
                  name: sonarqube-pg
          command:
            - sh
            - -c
            - |
              export pg_host=<config.{{.toolchains.postgresql.host | default "host"}}>
              export PGPASSWORD=${POSTGRES_POSTGRES_PASSWORD};
              export PGUSER=postgres;
              export port=<config.{{.toolchains.postgresql.port | default "5432"}}>
              until pg_isready -U ${PGUSER} -h ${pg_host} -p ${port}; do
                echo "等待 Postgres 启动..."
                sleep 2
              done
              # 创建数据库
              psql -h ${pg_host} -U ${PGUSER} -c "CREATE DATABASE sonarqubedb;"
      restartPolicy: OnFailure
